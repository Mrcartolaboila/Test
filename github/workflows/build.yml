github/workflows/build.yml

name: Compilar APK GKME

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          mkdir -p unpacked
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d unpacked
          ROOT="$(dirname "$(find "$PWD/unpacked" -name gradlew -type f | head -n 1)")"
          if [ ! -f "$ROOT/gradlew" ]; then
            echo "Não encontrei o gradlew executável."
            exit 1
          fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.4.3"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :android:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GKME-PTBR-P1-P16-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/build/outputs/apk/debug/*.apk
